name: OKX bot (cron)

# Scheduled --once runs, NOT a 24/7 process: GitHub caps a job at 6h and its
# Acceptable Use Policy does not allow Actions to host persistent services.
# Each run answers whatever Telegram commands are queued, does one OI/funding
# scan, then exits — the same shape as nlp-macro-event-bot.yml.
#
# Trade-off to be aware of: commands are answered on the schedule below, not
# instantly. At */10 a /chart request can sit up to ~10 minutes before a reply.
#
# Requires repository secrets: TG_BOT_TOKEN, TG_CHAT_ID

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Never let two runs scan at once — they would double-alert and race on state.
concurrency:
  group: okx-bot-cron
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Serve queued commands + one OI/funding scan
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python okx_tele_bot.py --once

      - name: Persist scan state back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add okx_scan_state.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "chore: update okx scan state [skip ci]"
          # Another run may have pushed while this one scanned; rebase and retry
          # rather than failing the job over a state-file race.
          for i in 1 2 3 4 5; do
            git push && exit 0
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || { git rebase --abort; break; }
          done
